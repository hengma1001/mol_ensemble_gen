# Finetune ESMFold2's diffusion module to reproduce mdCATH MD ensembles,
# conditioned on temperature. Run in the env with the fork (genAI).
#
# Pipeline:
#   mol-ensemble-gen featurize-cache examples/finetune_mdcath.yaml
#   torchrun --standalone --nproc_per_node=8 -m mol_ensemble_gen.cli finetune examples/finetune_mdcath.yaml
#   mol-ensemble-gen sample-md examples/finetune_mdcath.yaml --input some.fasta
#   mol-ensemble-gen eval-md   examples/finetune_mdcath.yaml --sampled-dir runs/finetune/samples --domain 1abcA00
#
# ---- PILOT (start here): a handful of short domains, single GPU ----
out_dir: runs/strat270_long_flow          # matched-step control: same steps, old data
seed: 20260728

data:
  mdcath_dir: /nfs/lambda_stor_01/homes/heng.ma/dataset/mdcath   # dir of mdcath_dataset_<domain>.h5
  cache_dir: cache/featurized
  # 270 training domains STRATIFIED BY LENGTH: equal counts per residue bin over
  # 51-452 residues (median 185). Deliberately not the natural mdCATH length
  # distribution (median 124) — the point is to cover lengths the model has never
  # seen; every previous run trained only on 47-177 residues.
  #
  # 270 is sized to what a 5000-step run actually consumes: the streaming dataset
  # walks domains sequentially at 75 micro-batches each, and 5000 steps x 4 accum
  # = 20,000 micro-batches reaches ~267 domains. A larger set would be partly
