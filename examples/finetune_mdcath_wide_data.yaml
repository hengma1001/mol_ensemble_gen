  val_domains:
    - 16pkA02
    - 1bxrA05
    - 2uxtA03
    - 5gv0A00
    - 3ml3A00
    - 1vw4J01
    - 1vkiA00
  temperatures: [320, 348, 379, 413, 450]
  replicas: null                        # null = all 5 replicas
  skip_frames: 20                        # frame stride (pilot: coarse)
  frames_per_step: 8                     # frames per micro-step (one domain+T)
  max_len: 220                           # covers the 208-residue val domain
  min_matched_fraction: 0.98             # drop domains whose atom map is worse

model:
  model_name: biohub/ESMFold2
  num_loops: 20                          # trunk recycles when caching conditioning
  backend: ours                          # ours (mol_ensemble_gen.model) | reference

temperature:
  ref: 379.0                             # centering T (K)
  scale: 65.0
  embed_dim: 451                         # must equal c_s_inputs
  hidden_dim: 256
  num_fourier: 32

optim:
  # Flow-tuned, calibrated over two pilots (see OptimConfig for the table):
  #   clip 1.0  -> 100%  of steps clipped (median norm 8.9)
  #   clip 20.0 -> 33.6% of steps clipped (median norm 14.6, p85 32.6)
  #   clip 35.0 -> 13.6% expected            <- current
  # lr stays at 1e-5: the median norm is below every candidate clip, so raising
  # the clip changes only the tail, not the median step size.
  # For scheme: edm instead use lr: 1.0e-4 and grad_clip: 1.0.
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 200
  max_steps: 5000                        # pilot: short
  grad_accum: 4
  grad_clip: 35.0
  lr_min_ratio: 0.05
  scheme: flow                           # "flow" (default) | "edm"

# Flow matching (the default scheme). Reuses the pretrained EDM denoiser via
# sigma = t/(1-t); the logit-normal draw is shifted by ln(sigma_data) so the noise
# band matches what the model was pretrained on.
flow:
  # Native flow-time conditioning: "add" embeds t directly alongside the
  # pretrained log-sigma features with a zero-init output, so step 0 is bitwise
  # the pretrained model. "replace" drops log-sigma entirely (no identity at
  # init, needs longer training). "off" = pretrained conditioning only.
  t_conditioning: add
  time_dist: logitnormal                 # "logitnormal" (ln sigma ~ N) | "uniform"
  p_mean: -1.2                           # logit-normal mean of ln sigma (matches EDM)
  p_std: 2.2                             # broadened: p95 sigma 57 -> 179, 3.5% above 256
  weighting: data                        # unit weight: stops 1/t^2 amplifying the widened low tail
  t_min: 1.0e-3                          # clamp t in [t_min, 1-t_min]
  num_sampling_steps: 50                 # ODE integration steps (sampling)
  sampler: euler                         # "euler" | "heun" (2nd-order)
  sigma_max: 256.0                        # start noise level (t_max = sigma/(1+sigma))

amp_dtype: bfloat16
log_every: 20
ckpt_every: 500
resume: true

# Experiment tracking (rank 0 only; off by default). Logs loss/mse/sigma/lr/
# grad_norm every log_every steps. Requires `wandb` (in the training extra) and
# `wandb login`. The run id defaults to a slug of out_dir so resume continues it.
wandb:
  enabled: true
  project: mol-ensemble-gen
  # entity: my-team                      # W&B team/user (default account if unset)
  # run_name: pilot-edm                  # display name (W&B auto-names if unset)
  tags: [mdcath, finetune]
  mode: online                           # online | offline | disabled

